  <div class="app-header">

            </div>
            <div id="divRoofType">

              <select id="roofType">
                <option value="single">单面坡</option>
                <option value="double" selected>双面坡</option>
                <option value="three">三面坡</option>
                <option value="four">四面坡</option>
                <option value="pavilion4">四角亭</option>
                <option value="pavilion6">六角亭</option>

            <div>

                <option value="深灰色">深灰色</option>
                <option value="红色">红色</option>
                <option value="金色">金色</option>
                <option value="浅灰色">浅灰色</option>
                <option value="橙色">橙色</option>

            <div id="divB"><label>总宽</label><input id="B" type="number" step="0.01" value="1"></div>
            <div id="divC"><label>总高</label><input id="C" type="number" step="0.01" placeholder="可选"></div>
            <div id="divD"><label>斜坡尺寸</label><input id="D" type="number" step="0.01" placeholder="可选，优先使用"></div>
            <div id="divE"><label>横脊长度</label><input id="E" type="number" step="0.01" placeholder="三/四面坡可选"></div>
            <div id="divWallThickness"><label>墙体厚度（围墙瓦用）</label><input id="wallThickness" type="number" step="0.01" placeholder="如0.24"></div>
          </div>

          <h3>报价设置</h3>
          <div class="grid">
            <div id="divPavilionMode">
              <label>亭子配瓦方式</label>
              <select id="pavilionMode">
                <option value="auto" selected>按梯形分段自动计算</option>
                <option value="common2m">2米四角亭常用清单</option>
              </select>
            </div>
            <div id="divCornerType">
              <label>翘角类型</label>
              <select id="cornerType">
                <option value="xiangyun" selected>祥云翘脚</option>
                <option value="qiaojiao">翘角</option>
              </select>
            </div>
          </div>
          <div id="divSealingAcc" style="display:none">
            <h3>封板瓦配件选择</h3>

              <div><label>平封数量（0=不要）</label><input id="sealFlat" type="number" min="0" step="1" value="0"></div>
              <div><label>内角数量（0=不要）</label><input id="sealInner" type="number" min="0" step="1" value="0"></div>
              <div><label>外角数量（0=不要）</label><input id="sealOuter" type="number" min="0" step="1" value="0"></div>
            </div>
            <div class="chk-row" style="margin-top:4px">

            </div>
          </div>

    function addItem(items, name, spec, qty, sell, cost, note="") {
      qty = Number(qty)||0;
      if (qty <= 0) return;
      items.push({name, spec, qty, sell:money(sell), amount:money(qty*sell), cost:money(cost), costAmount:money(qty*cost), note});
    }

    function mergeItems(items) {
      const map = new Map();
      items.forEach(it => {
        const key = [it.name,it.spec,it.sell,it.cost].join("|");
        if (!map.has(key)) map.set(key, {...it});
        else {
          const row = map.get(key);
          row.qty += it.qty;
          row.amount = money(row.qty * row.sell);
          row.costAmount = money(row.qty * row.cost);
        }
      });
      return [...map.values()];
    }

    function sumQuote(items) {
      const sell = money(items.reduce((s,i)=>s+i.amount,0));
      const cost = money(items.reduce((s,i)=>s+i.costAmount,0));
      return {sell, cost, profit:money(sell-cost), rate:sell ? money((sell-cost)/sell*100) : 0};
    }

    function matchOneSpec(slopeCm) {
      const specs = [30,40,50,60,70,80,90,100,110,120];

      const data = PRICE.plasticSplice[part][String(size)];

      if (cheapData) {
        console.log(`[chooseSplicePrice] 便宜料精确匹配: key=${key}, cheapData=`, JSON.stringify(cheapData));
        return {spec: data.spec, sell: cheapData.sell, cost: cheapData.cost};
      }
      const cheapKeys = Object.keys(PRICE.plasticOne.cheap).map(k => Number(k.match(/×(\d+)/)[1])).sort((a,b)=>a-b);
      const sizeNum = Number(size);
      const nearest = cheapKeys.reduce((prev, curr) => Math.abs(curr - sizeNum) < Math.abs(prev - sizeNum) ? curr : prev);
      const near = PRICE.plasticOne.cheap[`110×${nearest}`];
      console.log(`[chooseSplicePrice] 便宜料回退: size=${size} → nearest=${nearest}, nearData=`, JSON.stringify(near));

    function screwPerTile(lenCm) {
      if (lenCm <= 60) return 6;

      return 10 + screwPerTile(lenCm - 100);

    function splitCountByWidth(widths, unit=105, strictAbove=false) {
      let whole = 0, scraps = 0;
      widths.forEach(w => {
        if (w <= 0) return;
        whole += Math.floor(w / unit);
        const rem = w % unit;
        if (strictAbove ? rem > 50 : rem >= 50) whole += 1;
        else if (rem > 0) scraps += rem;
      });
      return whole + Math.ceil(scraps / unit);
    }

    function boardQty(lengthCm, count) {
      let one = Math.floor(lengthCm / 70) * 2;
      const rem = lengthCm % 70;
      if (rem > 0 && rem <= 30) one += 1;
      if (rem > 30) one += 2;
      return one * count;
    }

    function cornerExtensionRidges(edgeCm, count, usable) {
      let totalExt = 0;
      for (let i=0;i<count;i++) {
        totalExt += Math.max(0, edgeCm - usable);
      }
      return Math.ceil(totalExt / 100);
    }

    function hipRafterLen(B, angleRad) {
      const H = (B / 2) * Math.tan(angleRad);
      const hipHoriz = Math.sqrt((B/2)**2 + (B/2)**2);
      return Math.sqrt(hipHoriz**2 + H**2);
    }

    function choosePlasticSplice(slopeCm) {
      const up = [60,80,100], mid = [60,80,100], down = [40,50,60,80,100];
      const minMids = Math.max(0, Math.ceil((slopeCm - 200) / 100));
      for (let numMids = minMids; numMids <= minMids + 3; numMids++) {
        const combos = [];
        function genMid(prefix, depth) {
          if (depth === 0) {
            up.forEach(u => down.forEach(d => {
              const parts = [{part:"up",size:u}, ...prefix.map(m => ({part:"mid",size:m})), {part:"down",size:d}];
              const total = parts.reduce((s,x)=>s+x.size,0);
              const over = total - slopeCm;
              if (over >= 0) combos.push({parts,total,types:new Set(parts.map(p=>p.size)).size,over,count:parts.length});
            }));
            return;
          }
          mid.forEach(m => genMid([...prefix, m], depth - 1));
        }
        genMid([], numMids);
        if (combos.length > 0) {
          const result = combos.sort((a,b) => a.over - b.over || a.types - b.types || a.parts[a.parts.length-1].size - b.parts[b.parts.length-1].size)[0];
          console.log(`[choosePlasticSplice] slopeCm=${slopeCm}, 选择方案:`, result.parts.map(p=>`${p.part}×${p.size}`).join(" + "), `总长=${result.total}, 超出=${result.over}`);
          return result;
        }
      }
      console.log(`[choosePlasticSplice] slopeCm=${slopeCm}, 无合适方案`);
      return null;
    }

    function chooseCheapSplice(slopeCm) {
      const unit = 60;
      const downSizes = [40, 50, 60, 100];
      let best = null;
      for (let num60 = 1; num60 <= 20; num60++) {
        const beforeDown = num60 * unit;
        const remaining = slopeCm - beforeDown;
        if (remaining <= 0) continue;
        const downSize = downSizes.find(s => s >= remaining);
        if (!downSize) continue;
        const parts = [{part:"up", size:unit}];
        for (let i = 1; i < num60; i++) parts.push({part:"mid", size:unit});
        parts.push({part:"down", size:downSize});
        const total = parts.reduce((s,x)=>s+x.size,0);
        const over = total - slopeCm;
        if (!best || over < best.over || (over === best.over && parts.length < best.parts.length)) {
          best = {parts, total, over, count: parts.length};
        }
        if (over === 0) break;
      }
      const result = best || choosePlasticSplice(slopeCm);
      console.log(`[chooseCheapSplice] slopeCm=${slopeCm}, 选择方案:`, result ? result.parts.map(p=>`${p.part}×${p.size}`).join(" + ") : "无", `总长=${result?.total}, 超出=${result?.over}`);
      return result;
    }

    function inputDims() {
      const A = mToCm($("A").value), B = mToCm($("B").value), C0 = mToCm($("C").value), D = mToCm($("D").value), E = mToCm($("E").value);
      const angle = Number($("angle").value) * Math.PI / 180;
      const roofType = $("roofType").value;
      const width = B;
      const slopeBase = (roofType === "double" || roofType === "four" || roofType === "pavilion4") ? width / 2 : width;
      let C = C0, slope = D || 0;
      if (!D && C0) slope = C0 / Math.sin(angle);
      if (!D && !slope && slopeBase) slope = slopeBase / Math.cos(angle);
      if (!slope && A) slope = A / 2 / Math.cos(angle);
      if (!C && roofType === "double") C = slope;
      if (!C && (roofType === "three" || roofType === "four")) C = E || Math.max(0, A - width);
      if (!C && (roofType === "pavilion4" || roofType === "pavilion6")) C = A / 2 / Math.cos(angle);
      const pavilionHeight = C0 || (A / 2 * Math.tan(angle));
      const ridgeLength = (roofType === "three" || roofType === "four") ? (E || Math.max(0, A - width)) : C;
      return {A,B,C,D,E,slope, ridgeLength, angleDeg:Number($("angle").value), pavilionHeight};
    }

    function buildPlasticRoof(scenario) {

            tileCount += qty;
          });
          console.log(`[buildPlasticRoof] 拼接瓦总片数=${tileCount}`);
        }

        const ridgeLen = roof === "single" || roof === "double" ? A : ridgeLength;
        addItem(items, "正脊", acc.ridge.spec, ceilBy(ridgeLen,100), acc.ridge.sell, acc.ridge.cost);
        addItem(items, acc.zhengwen.name, acc.zhengwen.spec, 2, acc.zhengwen.sell, acc.zhengwen.cost);
        const cornerQty = roof === "single" ? 2 : roof === "double" ? 4 : roof === "three" ? 2 : 4;
        addItem(items, corner.name, corner.spec, cornerQty, corner.sell, corner.cost);
        const angleRad = angleDeg * Math.PI / 180;
        const edge = (roof === "four" || roof === "three") ? hipRafterLen(B, angleRad) : slope;
        const edgeCount = roof === "single" ? 2 : roof === "double" ? 4 : roof === "three" ? 2 : 4;
        addItem(items, "正脊", acc.ridge.spec, cornerExtensionRidges(edge, cornerQty, corner.usable), acc.ridge.sell, acc.ridge.cost);
        if (roof === "three" || roof === "four") {
          addItem(items, acc.board.name, acc.board.spec, boardQty(edge, edgeCount), acc.board.sell, acc.board.cost);
        }
        notes.push(`坡型按${roofName(roof)}计算。正脊按主脊长度和翘角延长分别计算后合并数量，瓦片数量采用分面宽度计算，${roof === "single" || roof === "double" ? "边料小于等于50公分可共用，大于50公分按1张瓦计算" : "边料小于50公分可共用，大于等于50公分按1张瓦计算"}。`);
      }

      const screwBase = items.filter(i => /一体瓦|拼上|拼中|拼下/.test(i.name)).reduce((s,i)=>{
        const m = (i.spec || "").match(/×(\d+)/);
        return s + i.qty * screwPerTile(m ? Number(m[1]) : 60);
      },0);
      const screwQty = fixedScrewQty || round10(screwBase);
      addItem(items, acc.screw.name, acc.screw.spec, screwQty, acc.screw.sell, acc.screw.cost);

      return makeQuote(`塑料瓦-${label}`, label, mergeItems(items), dims, notes);
    }

    function buildResin() {
      const roof = $("roofType").value;
      const {A,B,C,E,slope,ridgeLength,pavilionHeight,angleDeg} = inputDims();
      const items = [];
      const acc = PRICE.accResin;
      let tileCount = 0;
      const angleRadR = angleDeg * Math.PI / 180;
      const hipLenR = (roof === "four" || roof === "three") ? hipRafterLen(B, angleRadR) : 0;
      const dims = {A,B,C,D:slope,E, angle:angleDeg, hip:hipLenR};
      const notes = [
        "树脂瓦坡型尺寸按塑料瓦同一套规则计算。",
        "树脂瓦长度105公分，横向实际使用按1米；上下搭接时，每搭接一次有效坡长减少10公分。"
      ];

      if (roof === "pavilion4" || roof === "pavilion6") {
        const faces = roof === "pavilion4" ? 4 : 6;
        const height = pavilionHeight || 120;
        const lower = A;
        const parts = chooseResinParts(height);
        let cumulative = 0;
        parts.forEach((part, idx) => {
          cumulative += part.size;
          if (idx > 0) cumulative -= 10;
          const width = lower / height * Math.min(cumulative, height);
          const qty = splitCountByWidth(Array(faces).fill(width), 100);
          const data = PRICE.resin[part.part][String(part.size)];
          const name = part.part === "mid" ? "拼中" : "拼下";
          addItem(items, name, data.spec, qty, data.sell, data.cost, `分段宽度约${fmt(width)}公分`);
          tileCount += qty;
        });
        addItem(items, acc.gourd.name, acc.gourd.spec, 1, acc.gourd.sell, acc.gourd.cost);
        addItem(items, acc.corner.name, acc.corner.spec, faces, acc.corner.sell, acc.corner.cost);
        addItem(items, "斜脊/边脊", acc.ridge.spec, ceilBy(C || height,100) * faces, acc.ridge.sell, acc.ridge.cost, "树脂瓦斜脊不用连接板");
      } else {
        const strictCut = roof === "single" || roof === "double";
        let faceWidths = [];
        if (roof === "single") faceWidths = [A];
        if (roof === "double") faceWidths = [A,A];
        if (roof === "three") faceWidths = [A, B || slope, B || slope];
        if (roof === "four") faceWidths = [A,A,B || slope,B || slope];
        if (!faceWidths.length) faceWidths = [A,A];
        const qtyEach = splitCountByWidth(faceWidths, 100, strictCut);
        if (slope <= 190) {
          const one = chooseResinOne(slope);
          addItem(items, "一体瓦", one.spec, qtyEach, one.sell, one.cost, one.note);
          tileCount = qtyEach;
          notes.push("树脂瓦斜坡小于等于190公分时，按一体瓦计算。");
        } else {
          const parts = chooseResinRoofParts(slope);
          parts.forEach(part => {
            const data = PRICE.resin[part.part][String(part.size)];
            const name = part.part === "spliceUp" ? "拼上" : part.part === "mid" ? "拼中" : "拼下";
            addItem(items, name, data.spec, qtyEach, data.sell, data.cost);
            tileCount += qtyEach;
          });
          notes.push("树脂瓦非亭子坡面拼接时，按拼上、拼中、拼下组合计算。");
        }
        const ridgeLen = roof === "single" || roof === "double" ? A : ridgeLength;
        addItem(items, "主脊", acc.ridge.spec, ceilBy(ridgeLen,100), acc.ridge.sell, acc.ridge.cost);
        const angleRad = angleDeg * Math.PI / 180;
        const edgeLen = (roof === "four" || roof === "three") ? hipRafterLen(B, angleRad) : (roof === "single" || roof === "double" ? (C || slope) : slope);
        const edgeCount = roof === "single" ? 2 : roof === "double" ? 4 : roof === "three" ? 2 : 4;
        addItem(items, "斜脊/边脊", acc.ridge.spec, ceilBy(edgeLen * edgeCount, 100), acc.ridge.sell, acc.ridge.cost, "正脊可切割，按斜脊总长度合并取整");
        addItem(items, acc.gourd.name, acc.gourd.spec, 2, acc.gourd.sell, acc.gourd.cost);
        addItem(items, acc.corner.name, acc.corner.spec, roof === "single" ? 2 : roof === "double" ? 4 : roof === "three" ? 2 : 4, acc.corner.sell, acc.corner.cost);
        notes.push(`坡型按${roofName(roof)}计算。主脊、斜脊/边脊分别单独计算。树脂瓦翘角实际使用长度按0计算，斜脊/边脊全长需单独配1米正脊或斜脊。`);
      }

      const screwBase = items.filter(i => /一体瓦|拼上|拼中|拼下/.test(i.name)).reduce((s,i)=>{
        const m = (i.spec || "").match(/×(\d+)/);
        return s + i.qty * screwPerTile(m ? Number(m[1]) : 100);
      },0);
      addItem(items, acc.screw.name, acc.screw.spec, round10(screwBase), acc.screw.sell, acc.screw.cost);
      return makeQuote(`树脂瓦-${$("color").value || "深灰色"}`, $("color").value || "深灰色", mergeItems(items), dims, notes);
    }

    function chooseResinOne(slopeCm) {
      const specs = [30,40,50,60,70,80,90,100,110,120,130,140,150,160,170,180,190];
      const target = Math.max(Number(slopeCm)||0, 30);
      const spec = specs.find(s => s >= target);
      return PRICE.resin.one[String(spec)];
    }

    function chooseResinParts(height) {
      const combos = [
        [{part:"mid",size:100},{part:"down",size:100}],
        [{part:"mid",size:120},{part:"down",size:100}],
        [{part:"mid",size:120},{part:"down",size:120}],
        [{part:"mid",size:140},{part:"down",size:120}],
        [{part:"mid",size:140},{part:"down",size:140}]
      ];
      return combos.map(c => {
        const cover = c.reduce((s,x)=>s+x.size,0) - (c.length-1)*10;
        return {c, cover, over: cover-height, count:c.length, types:new Set(c.map(x=>x.size)).size};
      }).filter(x=>x.over>=0).sort((a,b)=>a.count-b.count || a.over-b.over || a.types-b.types)[0]?.c || combos[combos.length-1];
    }

    function chooseResinRoofParts(height) {
      const up = [80,100,120,140], mid = [100,120,140], down = [80,100,120,140];
      const combos = [];
      up.forEach(u => mid.forEach(m => down.forEach(d => combos.push([{part:"spliceUp",size:u}, {part:"mid",size:m}, {part:"down",size:d}]))));
      up.forEach(u => mid.forEach(m1 => mid.forEach(m2 => down.forEach(d => combos.push([{part:"spliceUp",size:u}, {part:"mid",size:m1}, {part:"mid",size:m2}, {part:"down",size:d}])))));
      return combos.map(c => {
        const cover = c.reduce((s,x)=>s+x.size,0) - (c.length-1)*10;
        return {c, cover, over: cover-height, count:c.length, types:new Set(c.map(x=>x.size)).size};
      }).filter(x=>x.over>=0).sort((a,b)=>a.count-b.count || a.over-b.over || a.types-b.types)[0]?.c || combos[combos.length-1];
    }

    function buildWall() {
      const A = mToCm($("A").value), thick = mToCm($("wallThickness").value);
      const items = [];
      const candidates = Object.entries(PRICE.wall).filter(([k])=>k!=="screw");
      const chosen = candidates.find(([,v]) => v.bottom - thick >= 11) || candidates[candidates.length-1];
      const qty = ceilBy(A,100);
      addItem(items, chosen[0], "有效1米", qty, chosen[1].sell, chosen[1].cost, `底部${chosen[1].bottom}公分`);
      addItem(items, PRICE.wall.screw.name, "套", round10(qty*6), PRICE.wall.screw.sell, PRICE.wall.screw.cost);
      return makeQuote("塑料围墙瓦", "围墙瓦", mergeItems(items), {A, wallThickness:thick}, [`围墙瓦底部宽度必须比墙体厚度多至少11公分。当前选择：${chosen[0]}。`]);
    }

    function selectSealingSize(series, wallH) {
      const keys = Object.keys(series).map(Number).sort((a,b)=>a-b);
      for (const k of keys) {
        if (wallH <= series[String(k)].height) return String(k);
      }
      return String(keys[keys.length-1]);
    }

    function buildSealingStandard() {
      const wallW = mToCm($("A").value), wallH = mToCm($("B").value);
      const color = $("color").value || "深灰色";
      const items = [];
      const dims = {A:wallW, B:wallH};
      const notes = [];
      const std = PRICE.sealing.standard;
      const sizeKey = selectSealingSize(std, wallH);
      const data = std[sizeKey];
      const rows = Math.max(1, Math.ceil(wallH / data.height));
      const hTiles = Math.max(1, Math.ceil(wallW / data.effWidth));
      const total = rows * hTiles;
      addItem(items, `${sizeKey}封板瓦`, `${data.thick} ${data.height}公分高`, total, data.sell, data.cost, `有效宽${data.effWidth}公分，${rows}行×${hTiles}张/行`);
      const acc = PRICE.sealing.acc[sizeKey];
      const hasEave = acc.eave.name.includes("飞檐");
      const accNotes = [];
      const eaveQty = Number($("sealEave").value) || 0;
      const flatQty = Number($("sealFlat").value) || 0;
      const innerQty = Number($("sealInner").value) || 0;
      const outerQty = Number($("sealOuter").value) || 0;
      if (eaveQty > 0 && hasEave) {
        addItem(items, `${sizeKey}飞檐`, `${sizeKey}封板瓦配套`, eaveQty, acc.eave.sell, acc.eave.cost, "顶部用");
        accNotes.push(`飞檐${eaveQty}个`);
      }
      if (flatQty > 0) {
        addItem(items, `${sizeKey}平封`, `${sizeKey}封板瓦配套`, flatQty, acc.eave.sell, acc.eave.cost, hasEave ? "底部用" : "每列1个");
        accNotes.push(`平封${flatQty}个`);
      }
      if (innerQty > 0) {
        addItem(items, `${sizeKey}内角`, `${sizeKey}封板瓦配套`, innerQty, acc.corner.sell, acc.corner.cost, "转角用");
        accNotes.push(`内角${innerQty}个`);
      }
      if (outerQty > 0) {
        addItem(items, `${sizeKey}外角`, `${sizeKey}封板瓦配套`, outerQty, acc.corner.sell, acc.corner.cost, "转角用");
        accNotes.push(`外角${outerQty}个`);
      }
      if ($("sealScrew").checked) {
        const screws = round10(8 * (wallW / 100) * rows);
        addItem(items, PRICE.sealing.screw.name, PRICE.sealing.screw.spec, screws, PRICE.sealing.screw.sell, PRICE.sealing.screw.cost, "每米8个");
        accNotes.push(`螺丝${screws}个`);
      }
      notes.push(`封板瓦标准系列：墙面宽${fmt(wallW)}公分×高${fmt(wallH)}公分。`);
      notes.push(`选用${sizeKey}封板瓦（${data.thick}厚，高${data.height}公分），有效宽度${data.effWidth}公分。`);
      notes.push(`排版：${rows}行×${hTiles}张/行=${total}张。配件：${accNotes.length ? accNotes.join("、") : "无"}。瓦片可切割。`);
      return makeQuote(`封板瓦-${color}标准`, `${color}标准`, mergeItems(items), dims, notes);
    }

    function buildSealingPainted() {
      const wallW = mToCm($("A").value), wallH = mToCm($("B").value);
      const color = $("color").value || "深灰色";
      const items = [];
      const dims = {A:wallW, B:wallH};
      const notes = [];
      const pnt = PRICE.sealing.painted;
      const sizeKey = selectSealingSize(pnt, wallH);
      const data = pnt[sizeKey];
      const rows = Math.max(1, Math.ceil(wallH / data.height));
      const hTiles = Math.max(1, Math.ceil(wallW / data.effWidth));
      const total = rows * hTiles;
      addItem(items, `彩绘${sizeKey}封板瓦`, `3mm ${data.height}公分高`, total, data.sell, data.cost, `有效宽${data.effWidth}公分，${rows}行×${hTiles}张/行`);
      const acc = PRICE.sealing.acc[sizeKey + "p"];
      const hasEave = acc.eave.name.includes("飞檐");
      const accNotes = [];
      const eaveQty = Number($("sealEave").value) || 0;
      const flatQty = Number($("sealFlat").value) || 0;
      const innerQty = Number($("sealInner").value) || 0;
      const outerQty = Number($("sealOuter").value) || 0;
      if (eaveQty > 0 && hasEave) {
        addItem(items, `彩绘${sizeKey}飞檐`, `彩绘${sizeKey}配套`, eaveQty, acc.eave.sell, acc.eave.cost, "顶部用");
        accNotes.push(`飞檐${eaveQty}个`);
      }
      if (flatQty > 0) {
        addItem(items, `彩绘${sizeKey}平封`, `彩绘${sizeKey}配套`, flatQty, acc.eave.sell, acc.eave.cost, hasEave ? "底部用" : "每列1个");
        accNotes.push(`平封${flatQty}个`);
      }
      if (innerQty > 0) {
        addItem(items, `彩绘${sizeKey}内角`, `彩绘${sizeKey}配套`, innerQty, acc.corner.sell, acc.corner.cost, "转角用");
        accNotes.push(`内角${innerQty}个`);
      }
      if (outerQty > 0) {
        addItem(items, `彩绘${sizeKey}外角`, `彩绘${sizeKey}配套`, outerQty, acc.corner.sell, acc.corner.cost, "转角用");
        accNotes.push(`外角${outerQty}个`);
      }
      if ($("sealScrew").checked) {
        const screws = round10(8 * (wallW / 100) * rows);
        addItem(items, PRICE.sealing.screw.name, PRICE.sealing.screw.spec, screws, PRICE.sealing.screw.sell, PRICE.sealing.screw.cost, "每米8个");
        accNotes.push(`螺丝${screws}个`);
      }
      notes.push(`封板瓦彩绘系列：墙面宽${fmt(wallW)}公分×高${fmt(wallH)}公分。`);
      notes.push(`选用彩绘${sizeKey}封板瓦（3mm厚，高${data.height}公分），有效宽度${data.effWidth}公分。`);
      notes.push(`排版：${rows}行×${hTiles}张/行=${total}张。配件：${accNotes.length ? accNotes.join("、") : "无"}。瓦片可切割。`);
      return makeQuote(`封板瓦-${color}彩绘`, `${color}彩绘`, mergeItems(items), dims, notes);
    }

    function makeQuote(title, scenario, items, dims, notes) {
      const total = sumQuote(items);
      return {title, scenario, items, dims, notes, total};
    }

    function roofName(v) {
      return {single:"单面坡",double:"双面坡",three:"三面坡",four:"四面坡",pavilion4:"四角亭",pavilion6:"六角亭",wallDouble:"围墙瓦"}[v] || v;
    }

    function generate() {
      const product = $("productType").value;
      quotes = [];
      if (product === "plastic") {
        if ($("color").value === "灰黑色") {
          quotes.push(buildPlasticRoof("normal"));
          quotes.push(buildPlasticRoof("cheap"));
        } else {
          quotes.push(buildPlasticRoof("normal"));
        }
      } else if (product === "resin") {
        quotes.push(buildResin());
      } else if (product === "sealing") {
        quotes.push(buildSealingStandard());
        quotes.push(buildSealingPainted());
      } else {
        quotes.push(buildWall());
      }
      active = 0;
      renderTabs();
      renderQuote();
      localStorage.setItem("fgw-last-inputs", JSON.stringify(readInputs()));
    }

    function readInputs() {
      const ids = ["productType","roofType","color","angle","A","B","C","D","E","wallThickness","pavilionMode","cornerType","sealEave","sealFlat","sealInner","sealOuter"];
      const data = Object.fromEntries(ids.map(id => [id, $(id).value]));
      if ($("sealScrew")) data.sealScrew = $("sealScrew").checked;
      return data;
    }

    function restoreInputs() {
      try {
        const data = JSON.parse(localStorage.getItem("fgw-last-inputs") || "{}");
        Object.entries(data).forEach(([id,val]) => {
          if (!$(id)) return;
          const el = $(id);
          if (el.type === "checkbox") { el.checked = val; return; }
          if (el.type === "number" && typeof val === "boolean") return;
          if (el.tagName === "SELECT" && ![...el.options].some(o => o.value === val)) return;
          el.value = val;
        });
      } catch {}
    }

    function renderTabs() {
      $("tabs").innerHTML = quotes.map((q,i)=>`<button class="tab ${i===active?'active':''}" onclick="active=${i};renderTabs();renderQuote()">${q.title}</button>`).join("");
    }

    function generalNote() {
      const p = $("productType").value;
      if (p === "sealing") return "封板瓦：根据墙面高度自动选择瓦片规格，瓦片可切割。飞檐、平封、内角、外角数量可手动修改（0=不需要），修改墙面尺寸时自动填入默认值。螺丝加帽默认每米8个。59系列无飞檐。";
      if (p === "resin") return "树脂瓦：主脊与斜脊/边脊分别单独计算。树脂瓦翘角实际使用长度按0计算，斜脊/边脊全长需单独配1米正脊或斜脊。";
      if (p === "wall") return "围墙瓦底部宽度必须比墙体厚度多至少11公分。";
      return "塑料瓦：主脊与翘角延长统称正脊，分别计算后合并数量。切割规则：三面坡、四面坡、亭子长度小于0.5米的边料可与其他面共用，长度大于等于0.5米时按1张瓦计算；单面坡、双面坡长度小于等于0.5米的边料可与其他面共用，长度大于0.5米时按1张瓦计算。";
    }

      $("result").innerHTML = `

        </div>
        <div class="summary">
          <div class="metric"><div class="k">售价合计</div><div class="v">${fmt(q.total.sell)}元</div></div>

          <section>
            <h2>顾客报价</h2>
            <div class="table-wrap"><table id="customerTable"><thead><tr><th>项目</th><th>规格</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th></tr></thead><tbody>${customerRows}</tbody></table></div>
            <div class="totals"><div class="total-pill">总金额：<strong>${fmt(q.total.sell)}元</strong></div></div>
          </section>
          <section>
            <h2>商家报价</h2>
            <div class="table-wrap"><table><thead><tr><th>项目</th><th>规格</th><th class="num">数量</th><th class="num">单价</th><th class="num">金额</th><th class="num">成本单价</th><th class="num">成本</th></tr></thead><tbody>${merchantRows}</tbody></table></div>
            <div class="totals">
              <div class="total-pill">售价合计：<strong>${fmt(q.total.sell)}元</strong></div>
              <div class="total-pill">成本合计：<strong>${fmt(q.total.cost)}元</strong></div>
              <div class="total-pill">利润：<strong>${fmt(q.total.profit)}元</strong></div>
            </div>
          </section>
        </div>
        <div class="notes">${q.notes.concat([generalNote()]).join("\n")}</div>
      `;
    }

    function dimsText(d) {
      const parts = [];
      const product = $("productType").value;
      if (product === "sealing") {
        if (d.A) parts.push(`墙面宽=${fmt(d.A)}公分`);
        if (d.B) parts.push(`墙面高=${fmt(d.B)}公分`);
        return parts.join("；");
      }
      const names = {A:"总长", B:"总宽", C:"总高", D:"斜坡尺寸", E:"横脊长度"};
      ["A","B","C","D","E"].forEach(k => {
        if (d[k]) parts.push(`${names[k]}=${fmt(d[k])}公分`);
      });
      if (d.hip) parts.push(`斜脊尺寸=${fmt(d.hip)}公分`);
      if (d.wallThickness) parts.push(`墙厚=${fmt(d.wallThickness)}公分`);
      if (d.angle) parts.push(`角度=${d.angle}°`);
      return parts.join("；");
    }

    function copyCustomerQuote() {
      if (!quotes.length) generate();
      const q = quotes[active];
      if (!q) return;
      const header = customerHeader(q);
      const lines = [header];
      if ($("productType").value === "sealing") {
        lines.push(`墙面：宽${fmt(mToCm($("A").value))}公分×高${fmt(mToCm($("B").value))}公分`);
      }
      q.items.forEach(i => lines.push(customerLine(i)));
      lines.push(`合计=${fmt(q.total.sell)}元`);
      const text = lines.filter(Boolean).join("\n").replace(/\\n/g, "\n");
      copyText(text);
    }

    function customerHeader(q) {
      const product = $("productType").value;
      const color = $("color").value || "灰黑色";
      if (product === "plastic") {
        if (q.scenario.includes("便宜")) return `【${color}】【便宜料】`;
        if (q.scenario.includes("全新")) return `【${color}】【全新料】`;
        return `【${color}】【花纹好料】`;
      }
      if (product === "resin") return `【${color || "深灰色"}】【树脂瓦】`;
      if (product === "sealing") {
        if (q.scenario.includes("彩绘")) return `【${color}】【封板瓦-彩绘】`;
        return `【${color}】【封板瓦-标准】`;
      }
      return `【围墙瓦】`;
    }

    function customerLine(i) {
      const amount = `${fmt(i.amount)}元`;
      const len = specLen(i.spec);
      if (i.name === "一体瓦") return `${fmt(i.qty)}张${len}公分一体瓦=${amount}`;
      if (i.name === "拼上") return `${fmt(i.qty)}张${len}公分拼接上段=${amount}`;
      if (i.name === "拼中") return `${fmt(i.qty)}张${len}公分拼接中段=${amount}`;
      if (i.name === "拼下") return `${fmt(i.qty)}张${len}公分拼接下段=${amount}`;
      if (i.name === "正脊") return `${fmt(i.qty)}根正脊=${amount}`;
      if (i.name === "主脊") return `${fmt(i.qty)}根主脊=${amount}`;
      if (i.name === "斜脊/边脊") return `${fmt(i.qty)}根斜脊/边脊=${amount}`;
      if (i.name === "翘角延长") return `${fmt(i.qty)}根翘角延长=${amount}`;
      if (i.name === "正吻") return `${fmt(i.qty)}个正吻=${amount}`;
      if (i.name === "祥云翘脚") return `${fmt(i.qty)}个90公分祥云翘脚=${amount}`;
      if (i.name === "翘脚") return `${fmt(i.qty)}个翘脚=${amount}`;
      if (i.name === "翘角") return `${fmt(i.qty)}个80公分翘角=${amount}`;
      if (i.name === "连接板") return `${fmt(i.qty)}张连接板=${amount}`;
      if (i.name === "宝顶葫芦" || i.name === "小葫芦" || i.name === "博古") return `${fmt(i.qty)}个${i.name}=${amount}`;
      if (i.name.includes("封板瓦")) return `${fmt(i.qty)}张${i.name}=${amount}`;
      if (i.name.includes("飞檐")) return `${fmt(i.qty)}个${i.name}=${amount}`;
      if (i.name.includes("平封")) return `${fmt(i.qty)}个${i.name}=${amount}`;
      if (i.name.includes("内角")) return `${fmt(i.qty)}个${i.name}=${amount}`;
      if (i.name.includes("外角")) return `${fmt(i.qty)}个${i.name}=${amount}`;
      if (i.name === "螺丝加帽") return `${fmt(i.qty)}个螺丝加帽=${amount}`;
      if (i.name.includes("螺丝") || i.name.includes("防水帽")) return `【优质】${fmt(i.qty)}套自攻螺丝加防水帽=${amount}`;
      return `${fmt(i.qty)}${unitFor(i.name)}${i.spec ? i.spec : ""}${i.name}=${amount}`;
    }

    function specLen(spec) {
      const m = String(spec||"").match(/[×xX*](\d+)/);
      return m ? m[1] : "";
    }

    function unitFor(name) {
      if (name.includes("瓦")) return "张";
      if (name.includes("脊") || name.includes("脚") || name.includes("角")) return "根";
      if (name.includes("吻") || name.includes("葫芦")) return "个";
      return "";
    }

    async function copyText(text) {
      showCopyBox(text, "正在复制，若浏览器拦截可直接按 Ctrl+C。");
      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (err) {
        copied = false;
      }
      if (!copied) {
        try {
          $("copyTextArea").focus();
          $("copyTextArea").select();
          copied = document.execCommand && document.execCommand("copy");
        } catch (err) {
          copied = false;
        }
      }
      setCopyStatus(copied ? "已复制，可直接粘贴。" : "浏览器限制自动复制，文本已选中，请按 Ctrl+C 复制。");
      $("copyBtn").textContent = copied ? "已复制，可直接粘贴" : "已选中，按 Ctrl+C";
      setTimeout(() => $("copyBtn").textContent = "复制顾客报价", 2200);
    }

    function showCopyBox(text, status="已生成报价文本。") {
      $("copyTextArea").value = text;
      $("copyBox").classList.add("show");
      $("copyTextArea").focus();
      $("copyTextArea").select();
      setCopyStatus(status);
    }

    function setCopyStatus(text) {
      if ($("copyStatus")) $("copyStatus").textContent = text;
    }

    function autoFillSealingAcc() {
      const p = $("productType").value;
      if (p !== "sealing") return;
      const wallW = mToCm($("A").value), wallH = mToCm($("B").value);
      if (wallW <= 0 || wallH <= 0) return;
      const std = PRICE.sealing.standard;
      const sizeKey = selectSealingSize(std, wallH);
      const data = std[sizeKey];
      const rows = Math.max(1, Math.ceil(wallH / data.height));
      const hTiles = Math.max(1, Math.ceil(wallW / data.effWidth));
      const hasEave = PRICE.sealing.acc[sizeKey].eave.name.includes("飞檐");
      if ($("sealEave")) $("sealEave").value = hasEave ? hTiles : 0;
      if ($("sealFlat")) $("sealFlat").value = hTiles;
      if ($("sealInner")) $("sealInner").value = 2 * rows;
      if ($("sealOuter")) $("sealOuter").value = 2 * rows;
    }

    function updateUIForProductType() {
      const p = $("productType").value;
      const isSealing = p === "sealing";
      const isWall = p === "wall";
      const hideCommon = ["divRoofType","divAngle","divC","divD","divE","divPavilionMode","divCornerType"];
      hideCommon.forEach(id => { if ($(id)) $(id).style.display = (isSealing || isWall) ? "none" : ""; });
      if ($("divWallThickness")) $("divWallThickness").style.display = isSealing ? "none" : "";
      if ($("divSealingAcc")) $("divSealingAcc").style.display = isSealing ? "" : "none";
      const labelA = document.querySelector('#divA label');
      const labelB = document.querySelector('#divB label');
      if (isSealing) {
        if (labelA) labelA.textContent = '墙面宽度';
        if (labelB) labelB.textContent = '墙面高度';
      } else if (isWall) {
        if (labelA) labelA.textContent = '围墙总长';
        if (labelB) labelB.textContent = '总宽';
      } else {
        if (labelA) labelA.textContent = '总长';
        if (labelB) labelB.textContent = '总宽';
      }
    }

    $("calcBtn").addEventListener("click", generate);
    $("printBtn").addEventListener("click", () => window.print());
    $("copyBtn").addEventListener("click", copyCustomerQuote);
    $("calcBtnMobile").addEventListener("click", () => { generate(); document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"}); });
    $("copyBtnMobile").addEventListener("click", copyCustomerQuote);
    $("printBtnMobile").addEventListener("click", () => window.print());
    $("selectCopyText").addEventListener("click", () => {
      $("copyTextArea").focus();
      $("copyTextArea").select();
      setCopyStatus("文本已全选，请按 Ctrl+C 复制。");
    });
    $("toggleParams").addEventListener("click", () => {
      const header = $("toggleParams");
      const body = $("bodyParams");
      const isCollapsed = body.classList.contains("collapsed");
      if (isCollapsed) {
        body.classList.remove("collapsed");
        body.classList.add("expanded");
        header.classList.remove("collapsed");
      } else {
        body.classList.remove("expanded");
        body.classList.add("collapsed");
        header.classList.add("collapsed");
      }
    });
    $("productType").addEventListener("change", () => {
      const p = $("productType").value;
      if (p === "wall") $("roofType").value = "wallDouble";
      if (p !== "wall" && p !== "sealing" && $("roofType").value === "wallDouble") $("roofType").value = "double";
      updateUIForProductType();
      autoFillSealingAcc();
      generate();
    });
    ["roofType","color","angle","C","D","E","wallThickness","pavilionMode","cornerType"].forEach(id => {
      $(id).addEventListener("change", generate);
    });
    ["A","B"].forEach(id => {
      $(id).addEventListener("change", () => {
        if ($("productType").value === "sealing") autoFillSealingAcc();
        generate();
      });
    });
    ["sealEave","sealFlat","sealInner","sealOuter","sealScrew"].forEach(id => {
      if ($(id)) $(id).addEventListener("change", generate);
    });
    restoreInputs();
    updateUIForProductType();
    if ($("productType").value === "sealing") {
      const allZero = ["sealEave","sealFlat","sealInner","sealOuter"].every(id => !Number($(id).value));
      if (allZero) autoFillSealingAcc();
    }
    generate();
  </script>
</body>
</html>
